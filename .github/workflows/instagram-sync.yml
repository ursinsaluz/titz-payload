name: Instagram Sync (täglich)

# Holt einmal täglich die neusten Beiträge von @titzsebastian über die
# Instagram Graph API (Secret INSTAGRAM_ACCESS_TOKEN) oder einen JSON-Feed
# (Secret INSTAGRAM_FEED_URL), legt neue Bilder im R2-Bucket ab und stösst bei
# Änderungen den statischen Frontend-Build über den Deploy-Hook an.
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Instagram-Beiträge mit Payload CMS abgleichen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && (secrets.INSTAGRAM_ACCESS_TOKEN != '' || secrets.INSTAGRAM_FEED_URL != '') }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instagram-Beiträge synchronisieren
        working-directory: apps/cms
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ignore
          INSTAGRAM_APPLY: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
          WEB_DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
        run: npx payload run scripts/syncInstagram.ts
